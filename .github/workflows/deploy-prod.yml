name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      
      - name: Run linter
        run: npm run lint
      
      - name: Build project
        run: npm run build
      
      - name: Run tests
        run: npm test

  deploy-production:
    name: Deploy to Production (Render)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.RENDER_PROD_URL }}
    
    steps:
      - name: Get tag version
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Trigger Render Deploy (Production)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Deployment complete
        run: |
          echo "✅ Deployed version ${{ steps.tag_version.outputs.VERSION }} to Production"
          echo "🔗 URL: ${{ secrets.RENDER_PROD_URL }}"
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.tag_version.outputs.VERSION }}
          body: |
            ## WhatsApp Salesforce Chatbot - ${{ steps.tag_version.outputs.VERSION }}
            
            ### Deployed to Production 🚀
            
            **Deployment URL:** ${{ secrets.RENDER_PROD_URL }}
            
            ### Changes
            See commit history for details.
          draft: false
          prerelease: false
